name: Release

# A person creates a release in this repo (Releases, New release):
#   staging/vX.Y.Z-rc.N  a test round of X.Y.Z, on a commit of main (or of a release/* branch cut
#                        from a prod tag, for a hotfix). Builds the be image and the web for staging and prod
#                        once, records the version in deploy/staging/versions.yaml and deploys it.
#                        The apps are built only after a person approves app-test.
#   prod/vX.Y.Z          made by Promote on the commit of a tested rc: reuses that rc's image and
#                        web build, records deploy/prod/versions.yaml, and Deploy waits for the
#                        production approval. The apps wait for app-store.
# A later rc on the same commit reuses whatever that commit already built.
# Promote starts this through workflow_dispatch, because a tag it creates with GITHUB_TOKEN starts
# no workflow by itself.
on:
  push:
    tags: ['staging/v*', 'prod/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (staging/vX.Y.Z-rc.N or prod/vX.Y.Z)
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      stage: ${{ steps.v.outputs.stage }}
      sha: ${{ steps.v.outputs.sha }}
      from: ${{ steps.v.outputs.from }}
      build: ${{ steps.v.outputs.stage == 'staging' && steps.v.outputs.from == '' }}
      mobile_stages: ${{ steps.v.outputs.mobile_stages }}
      config_stages: ${{ steps.v.outputs.config_stages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the tag and find earlier builds of this commit
        id: v
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^staging/v([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+)$ ]]; then
            STAGE=staging; VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^prod/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            STAGE=prod; VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag $TAG must be staging/vX.Y.Z-rc.N or prod/vX.Y.Z."; exit 1
          fi
          SHA=$(git rev-parse "$TAG^{commit}")
          if [ "$STAGE" = prod ]; then
            PREV=$(git tag --points-at "$SHA" | grep -E "^staging/v$VERSION-rc\.[0-9]+$" | sort -V | tail -1 || true)
            [ -n "$PREV" ] || { echo "::error::No staging/v$VERSION-rc.N on ${SHA::7}: this commit never went to staging. Use Promote."; exit 1; }
          else
            PREV=$(git tag --points-at "$SHA" | grep -E '^staging/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' | grep -vx "$TAG" | sort -V | tail -1 || true)
            # An rc is cut from main, or from a release/* branch (a hotfix cut from a prod tag).
            if ! git merge-base --is-ancestor "$SHA" origin/main && ! git branch -r --contains "$SHA" | grep -q 'origin/release/'; then
              echo "::error::$TAG is on ${SHA::7}, which is on neither main nor a release/* branch."; exit 1
            fi
            # One version number names one line of code: every earlier rc of it must come before this
            # commit. Otherwise main and a hotfix (or two hotfixes) would share the number.
            BASE="${VERSION%-rc.*}"
            git rev-parse -q --verify "refs/tags/prod/v$BASE" >/dev/null && { echo "::error::$BASE is already released to prod; use the next version."; exit 1; }
            for t in $(git tag --list "staging/v$BASE-rc.*" | grep -vx "$TAG"); do
              if ! git merge-base --is-ancestor "$t" "$SHA"; then
                LINE="${BASE%.*}"
                HIGH=$(git tag --list "prod/v$LINE.*" "staging/v$LINE.*" | sed -E 's#^(prod|staging)/v##; s/-rc\.[0-9]+$//' | sort -V | tail -1)
                echo "::error::$t is on another line of code (not before ${SHA::7}), so $BASE is taken. Use $LINE.$(( ${HIGH##*.} + 1 ))."; exit 1
              fi
            done
          fi
          has() { [ -n "$PREV" ] && gh release view "$PREV" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$1"; }
          if [ "$STAGE" = prod ]; then
            if has android-prod-app-release.aab || has android-prod-debug.apk; then MOBILE='[]'; else MOBILE='["prod"]'; fi
          else
            if has android-staging-app-release.apk || has android-staging-debug.apk; then MOBILE='[]'; else MOBILE='["staging","prod"]'; fi
          fi
          if [ "$STAGE" = staging ] && [ -z "$PREV" ]; then CONFIG='["staging","prod"]'; else CONFIG="$MOBILE"; fi
          {
            echo "stage=$STAGE"; echo "version=$VERSION"; echo "sha=$SHA"; echo "from=$PREV"
            echo "mobile_stages=$MOBILE"; echo "config_stages=$CONFIG"
          } >> "$GITHUB_OUTPUT"
          echo "$TAG on ${SHA::7}: ${PREV:+reuses the builds of $PREV}${PREV:-builds new}; apps to build after approval: $MOBILE"

  be-image:
    needs: meta
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}
      VERSION: ${{ needs.meta.outputs.version }}
      FROM: ${{ needs.meta.outputs.from }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push (first rc of this commit)
        if: ${{ needs.meta.outputs.from == '' }}
        working-directory: apps/be
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --build-arg GIT_SHA="${{ needs.meta.outputs.sha }}" --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
      - name: Retag the image already built for this commit
        if: ${{ needs.meta.outputs.from != '' }}
        run: docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:${FROM#*/v}"

  # One config.json per stage, from that environment's variables. Web and apps bake the same file.
  config:
    needs: meta
    if: ${{ needs.meta.outputs.config_stages != '[]' }}
    strategy:
      matrix:
        stage: ${{ fromJSON(needs.meta.outputs.config_stages) }}
    runs-on: ubuntu-latest
    # Build-only environments: they hold the FE values and need no approval, unlike the deploy ones.
    environment: ${{ matrix.stage == 'prod' && 'build-prod' || 'build-staging' }}
    defaults:
      run:
        working-directory: apps/fe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - name: Bake config.json
        env:
          STAGE: ${{ matrix.stage }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: node scripts/write-config.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: config-${{ matrix.stage }}
          path: apps/fe/public/config.json

  web:
    needs: [meta, config]
    if: ${{ needs.meta.outputs.build == 'true' }}
    strategy:
      matrix:
        stage: [staging, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/fe/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - uses: actions/download-artifact@v4
        with:
          name: config-${{ matrix.stage }}
          path: apps/fe/public
      - name: Build the web for ${{ matrix.stage }}
        env:
          VITE_APP_VERSION: ${{ needs.meta.outputs.version }}
          VITE_GIT_SHA: ${{ needs.meta.outputs.sha }}
          VITE_API_ENV: ${{ matrix.stage }}
        run: |
          npm run build
          # What this build is, written by the build itself; the deploy checks it against the version.
          printf '{"app":"fe","version":"%s","commit":"%s","stage":"%s","builtAt":"%s"}\n' \
            "$VITE_APP_VERSION" "$VITE_GIT_SHA" "$VITE_API_ENV" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
          (cd dist && zip -qr "$GITHUB_WORKSPACE/web-build-${{ matrix.stage }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.stage }}
          path: web-build-${{ matrix.stage }}.zip

  # Puts the web builds on this tag's release (new for a first rc, an earlier rc's otherwise).
  publish-web:
    needs: [meta, web]
    if: ${{ !cancelled() && needs.meta.result == 'success' && (needs.meta.outputs.build != 'true' || needs.web.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STAGE: ${{ needs.meta.outputs.stage }}
      FROM: ${{ needs.meta.outputs.from }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.outputs.build == 'true' }}
        with:
          pattern: web-*
          path: builds
          merge-multiple: true
      - name: Collect the web builds
        run: |
          set -euo pipefail
          mkdir upload
          if [ -n "$FROM" ]; then gh release download "$FROM" -D upload -p 'web-build-*'
          else cp builds/web-build-*.zip upload/; fi
          [ "$STAGE" = prod ] && find upload -type f ! -name '*prod*' -delete
          [ -f "upload/web-build-$STAGE.zip" ] || { echo "::error::No web-build-$STAGE.zip in ${FROM:-this build}."; exit 1; }
          ls -la upload
      - name: GitHub release (reuse the one made in the UI, if any)
        run: |
          FLAG=$([ "$STAGE" = staging ] && echo --prerelease || echo --latest)
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" $FLAG
          else gh release create "$TAG" --verify-tag --generate-notes $FLAG; fi
          gh release upload "$TAG" upload/* --clobber

  # Writes what the stage runs on main; that push starts Deploy. It goes through the deploy key,
  # the only actor the main ruleset lets past the pull request rule. The apps are not waited for.
  record:
    needs: [meta, be-image, publish-web]
    if: ${{ !cancelled() && needs.be-image.result == 'success' && needs.publish-web.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: ${{ needs.meta.outputs.stage }}
      VERSION: ${{ needs.meta.outputs.version }}
      SHA: ${{ needs.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Record what ${{ needs.meta.outputs.stage }} runs
        run: |
          set -euo pipefail
          F="deploy/$STAGE/versions.yaml"
          git config user.name "ff-poc release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            sed -i -E "s/^(version:[[:space:]]*)[^[:space:]#]+.*/\1$VERSION   # ${SHA::7}/; s/^(mobile:[[:space:]]*)[^[:space:]#]+/\1$VERSION/" "$F"
            cat "$F"
            git commit -qam "$STAGE: release $VERSION ($TAG)" || { echo "Already recorded."; break; }
            git push -q origin HEAD:main && break
            git fetch -q origin main && git reset -q --hard origin/main
          done
          {
            echo "### $TAG"
            echo '```yaml'; cat "$F"; echo '```'
            echo "Deploy started for $STAGE$([ "$STAGE" = prod ] && echo '; it waits for the production approval')."
          } >> "$GITHUB_STEP_SUMMARY"

  # Nothing is built or sent for the apps until a person approves: app-test for an rc, app-store
  # for prod. Leaving it unapproved costs no build minutes.
  mobile-approval:
    needs: [meta, publish-web]
    if: ${{ !cancelled() && needs.publish-web.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.meta.outputs.stage == 'prod' && 'app-store' || 'app-test' }}
    steps:
      - name: Store credentials (prod only, from the app-store environment)
        if: ${{ needs.meta.outputs.stage == 'prod' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set in app-store: the store release stays simulated."
          [ -n "$APP_STORE_CONNECT_API_KEY" ] || echo "::warning::APP_STORE_CONNECT_API_KEY is not set in app-store: the store release stays simulated."
      - run: 'echo "Approved. Apps to build: ${{ needs.meta.outputs.mobile_stages }} (empty = reuse the rc builds)."'

  android:
    needs: [meta, config, mobile-approval]
    if: ${{ !cancelled() && needs.mobile-approval.result == 'success' && needs.meta.outputs.mobile_stages != '[]' }}
    strategy:
      matrix:
        stage: ${{ fromJSON(needs.meta.outputs.mobile_stages) }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      ref: ${{ needs.meta.outputs.sha }}
      version_name: ${{ needs.meta.outputs.version }}
      stage: ${{ matrix.stage }}

  ios:
    needs: [meta, config, mobile-approval]
    if: ${{ !cancelled() && needs.mobile-approval.result == 'success' && needs.meta.outputs.mobile_stages != '[]' }}
    strategy:
      matrix:
        stage: ${{ fromJSON(needs.meta.outputs.mobile_stages) }}
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    with:
      ref: ${{ needs.meta.outputs.sha }}
      version_name: ${{ needs.meta.outputs.version }}
      stage: ${{ matrix.stage }}

  # Attaches the app builds (new, or the rc's) to the release: staging for the testers, prod for
  # the stores (both simulated until store accounts exist).
  mobile-release:
    needs: [meta, mobile-approval, android, ios]
    if: ${{ !cancelled() && needs.mobile-approval.result == 'success' && (needs.meta.outputs.mobile_stages == '[]' || (needs.android.result == 'success' && needs.ios.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STAGE: ${{ needs.meta.outputs.stage }}
      VERSION: ${{ needs.meta.outputs.version }}
      FROM: ${{ needs.meta.outputs.from }}
      BUILT: ${{ join(fromJSON(needs.meta.outputs.mobile_stages), ' ') }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.outputs.mobile_stages != '[]' }}
        with:
          pattern: android-*
          path: builds
      - uses: actions/download-artifact@v4
        if: ${{ needs.meta.outputs.mobile_stages != '[]' }}
        with:
          pattern: ios-simulator-app-*
          path: builds
      - name: Collect the app builds
        run: |
          set -euo pipefail
          mkdir upload
          if [ -z "$BUILT" ]; then
            gh release download "$FROM" -D upload -p 'android-*' -p 'ios-*'
            [ "$STAGE" = prod ] && find upload -type f ! -name '*prod*' -delete
          fi
          for s in $BUILT; do
            # Signed builds when the keystore secrets are set; the debug APK always.
            find builds -path "*android-release-$VERSION-$s*" -name '*.aab' -exec cp {} "upload/android-$s-app-release.aab" \;
            find builds -path "*android-release-$VERSION-$s*" -name '*.apk' -exec cp {} "upload/android-$s-app-release.apk" \;
            find builds -path "*android-debug-apk-$s*" -name '*.apk' -exec cp {} "upload/android-$s-debug.apk" \;
            cp "builds/ios-simulator-app-$VERSION-$s/App-simulator.zip" "upload/ios-$s-App-simulator.zip"
          done
          ls -la upload
          gh release upload "$TAG" upload/* --clobber
          {
            echo "### Apps $VERSION ($STAGE) attached to $TAG"
            echo "$([ -n "$BUILT" ] && echo "Built after the approval." || echo "The builds of $FROM, no rebuild.")"
            echo; echo '```'; ls -1 upload; echo '```'
            echo "Store and tester delivery are simulated in this POC."
          } >> "$GITHUB_STEP_SUMMARY"
