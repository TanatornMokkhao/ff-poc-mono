name: Release

# Starts on a release tag: a person's rc (Releases, New release) or Promote's prod tag.
# The steps live in release-run.yml and are always taken from main: a tag on a release branch cut
# from an old prod tag would otherwise run that old commit's release logic.
on:
  push:
    tags: ['staging/v*', 'prod/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to run again (staging/vX.Y.Z-rc.N or prod/vX.Y.Z)
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  run:
    uses: TanatornMokkhao/ff-poc-mono/.github/workflows/release-run.yml@main
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.ref_name }}
