name: Promote to prod

# Pick what goes to prod (the list is every candidate, newest first):
#   X.Y.Z-rc.N       an rc that staging tested. prod/vX.Y.Z goes on the rc's commit and reuses its
#                    builds.
#   release/X.Y.Z    a hotfix straight to prod: the head of that branch, cut from a prod tag with the
#                    fix cherry-picked from main. It is built for prod only and never touches staging,
#                    so the first place that build runs is prod. CI must have passed on it.
# Pushes prod/vX.Y.Z, which starts Release; Deploy waits for the production approval.
on:
  workflow_dispatch:
    inputs:
      # The list is rewritten by Update menus after every release and every push to release/*.
      rc:
        description: What to promote (an rc staging tested, or release/X.Y.Z straight to prod)
        type: choice
        options:
          # rc-menu:start
          - 'none'
          # rc-menu:end
      notes:
        description: Release notes (optional)
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PICK: ${{ inputs.rc }}
      NOTES: ${{ inputs.notes }}
    steps:
      # The tag is pushed with the deploy key: GITHUB_TOKEN may not create a ref on a commit that
      # holds workflow files, and a deploy key push starts Release by itself.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Pick what goes to prod
        run: |
          set -euo pipefail
          if [[ "$PICK" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            V="${BASH_REMATCH[1]}"; FROM="$PICK (hotfix straight to prod)"
            SHA=$(git rev-parse -q --verify "origin/$PICK") || { echo "::error::There is no branch $PICK."; exit 1; }
            CI=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "ci") | .conclusion] | first // "none"')
            [ "$CI" = success ] || { echo "::error::CI on $PICK (${SHA::7}) is '$CI', not success. Wait for it, or fix the branch."; exit 1; }
            LAST=$(git tag --list 'prod/v*' --sort=-v:refname | head -1)
            git merge-base --is-ancestor "$LAST" "$SHA" || echo "::warning::$PICK was not cut from the newest prod release $LAST."
          elif [[ "$PICK" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
            V="${BASH_REMATCH[1]}"; FROM="staging/v$PICK"
            git rev-parse -q --verify "refs/tags/$FROM" >/dev/null || { echo "::error::There is no $FROM."; exit 1; }
            SHA=$(git rev-parse "$FROM^{commit}")
            CUR=$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' deploy/staging/versions.yaml)
            [ "$CUR" = "$PICK" ] || echo "::warning::Promoting $FROM while staging runs $CUR."
          else
            echo "::error::'$PICK' is neither an rc nor release/X.Y.Z (the list may be empty: run Update menus)."; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/prod/v$V" >/dev/null; then
            echo "::error::prod/v$V already exists. Release tags are permanent: release the next version."; exit 1
          fi
          { echo "V=$V"; echo "FROM=$FROM"; echo "SHA=$SHA"; } >> "$GITHUB_ENV"

      # Every commit prod would gain must already be on main, directly or as a cherry-pick of a main
      # commit; otherwise the next release from main would lose it.
      - name: Every change is on main
        run: |
          set -euo pipefail
          # FROM and SHA come from GITHUB_ENV (the step before), which shellcheck cannot see.
          # shellcheck disable=SC2153
          LAST=$(git tag --list 'prod/v*' --sort=-v:refname | head -1)
          [ -n "$LAST" ] || LAST=$(git rev-list --max-parents=0 "$SHA" | tail -1)
          BYPASS=""
          [[ "$FROM" == staging/* ]] && BYPASS=$(gh release view "$FROM" --json body --jq .body | sed -n 's/^Hotfix-not-on-main: //p')
          missing=""
          for c in $(git rev-list "$LAST..$SHA"); do
            git merge-base --is-ancestor "$c" origin/main && continue
            from=$(git log -1 --format=%B "$c" | sed -nE 's/.*cherry picked from commit ([0-9a-f]{40}).*/\1/p' | head -1)
            if [ -n "$from" ] && git merge-base --is-ancestor "$from" origin/main; then
              echo "${c::7} is a cherry-pick of main ${from::7}"; continue
            fi
            missing+="${c::7} "
          done
          if [ -n "$missing" ]; then
            if [ -n "$BYPASS" ]; then
              echo "::warning::Not on main: $missing(allowed by the hotfix: $BYPASS). Bring them to main or the next release loses them."
            else
              echo "::error::$FROM would ship commits that are not on main: $missing. Merge them into main first (and cherry-pick with -x)."; exit 1
            fi
          fi
          echo "Every commit since ${LAST} is on main."

      - name: Create prod/v${{ env.V }} and release it
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'prod/v*' --sort=-v:refname | head -1)
          CHANGES=$(bash scripts/release-notes.sh "$LAST" "$SHA")
          COMPARE=""
          [ -z "$LAST" ] || COMPARE="Full diff: https://github.com/$GH_REPO/compare/$LAST...prod/v$V"
          BODY=$(printf 'Promoted from %s (%s).\n\n%s\n\n## Changes since %s\n\n%s\n\n%s\n' \
            "$FROM" "${SHA::7}" "$NOTES" "${LAST:-the first commit}" "$CHANGES" "$COMPARE")
          git tag "prod/v$V" "$SHA"
          git push -q origin "prod/v$V"
          # Release starts from the push and may make the GitHub release first; either way it gets the notes.
          if gh release view "prod/v$V" >/dev/null 2>&1; then gh release edit "prod/v$V" --notes "$BODY" --latest
          else gh release create "prod/v$V" --verify-tag --title "prod/v$V" --notes "$BODY" --latest; fi
          {
            echo "### prod/v$V created from $FROM"
            if [[ "$FROM" == release/* ]]; then
              echo "Release builds it for prod now (it never ran on staging); approve **production** in Deploy and **app-store** in Release."
            else
              echo "Release reuses the $FROM builds; approve **production** in Deploy and **app-store** in Release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
