name: Promote to prod

# Releases to prod exactly what an rc tested. Leave "rc" empty to promote what staging runs now; give
# a number to promote that rc of the same version instead. Creates prod/vX.Y.Z on that rc's commit,
# then starts Release, which reuses the rc's builds; Deploy waits for the production approval.
on:
  workflow_dispatch:
    inputs:
      rc:
        description: rc number to promote (empty = what staging runs now)
        type: string
        required: false
      notes:
        description: Release notes (optional)
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RC_INPUT: ${{ inputs.rc }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the rc
        run: |
          set -euo pipefail
          CUR=$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' deploy/staging/versions.yaml)
          [[ "$CUR" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]] || { echo "::error::Staging runs '$CUR', not an rc."; exit 1; }
          V="${BASH_REMATCH[1]}"; N="${RC_INPUT:-${BASH_REMATCH[2]}}"
          [[ "$N" =~ ^[0-9]+$ ]] || { echo "::error::rc must be a number, got '$N'."; exit 1; }
          RC="staging/v$V-rc.$N"
          git rev-parse -q --verify "refs/tags/$RC" >/dev/null || { echo "::error::There is no $RC."; exit 1; }
          if git rev-parse -q --verify "refs/tags/prod/v$V" >/dev/null; then
            echo "::error::prod/v$V already exists. Release tags are permanent: release the next version."; exit 1
          fi
          echo "V=$V" >> "$GITHUB_ENV"; echo "RC=$RC" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse "$RC^{commit}")" >> "$GITHUB_ENV"
          [ -z "$RC_INPUT" ] || [ "$N" = "${BASH_REMATCH[2]}" ] || echo "::warning::Promoting $RC while staging runs $CUR."

      # Every commit prod would gain must already be on main, directly or as a cherry-pick of a main
      # commit; otherwise the next release from main would lose it.
      - name: Every change is on main
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'prod/v*' --sort=-v:refname | head -1)
          [ -n "$LAST" ] || LAST=$(git rev-list --max-parents=0 "$SHA" | tail -1)
          BYPASS=$(gh release view "$RC" --json body --jq .body | sed -n 's/^Hotfix-not-on-main: //p')
          missing=""
          for c in $(git rev-list "$LAST..$SHA"); do
            git merge-base --is-ancestor "$c" origin/main && continue
            from=$(git log -1 --format=%B "$c" | sed -nE 's/.*cherry picked from commit ([0-9a-f]{40}).*/\1/p' | head -1)
            if [ -n "$from" ] && git merge-base --is-ancestor "$from" origin/main; then
              echo "${c::7} is a cherry-pick of main ${from::7}"; continue
            fi
            missing+="${c::7} "
          done
          if [ -n "$missing" ]; then
            if [ -n "$BYPASS" ]; then
              echo "::warning::Not on main: $missing(allowed by the hotfix: $BYPASS). Bring them to main or the next release loses them."
            else
              echo "::error::$RC would ship commits that are not on main: $missing. Merge them into main first."; exit 1
            fi
          fi
          echo "Every commit since ${LAST} is on main."

      - name: Create prod/v${{ env.V }} and release it
        run: |
          set -euo pipefail
          BODY=$(printf 'Promoted from %s (%s).\n\n%s\n' "$RC" "${SHA::7}" "$NOTES")
          gh release create "prod/v$V" --target "$SHA" --title "prod/v$V" --notes "$BODY" --latest
          gh workflow run release.yml --ref "prod/v$V" -f tag="prod/v$V"
          {
            echo "### prod/v$V created from $RC"
            echo "Release reuses the $RC builds; approve **production** in Deploy and **app-store** in Release."
          } >> "$GITHUB_STEP_SUMMARY"
