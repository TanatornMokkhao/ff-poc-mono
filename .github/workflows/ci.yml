name: CI

# One workflow for the whole repo. Each app's jobs run only when the change touches that app (or
# this file); the "ci" job always runs and is the one required check on main, so a pull request
# that skips an app is not left waiting for a check that never starts.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.c.outputs.be }}
      fe: ${{ steps.c.outputs.fe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then CHANGED=$(git diff --name-only "$BASE" HEAD)
          else CHANGED=$(git ls-files); fi
          all=$(grep -qx '.github/workflows/ci.yml' <<<"$CHANGED" && echo true || echo false)
          for app in be fe; do
            if [ "$all" = true ] || grep -q "^apps/$app/" <<<"$CHANGED"; then echo "$app=true" >> "$GITHUB_OUTPUT"; fi
          done
          echo "$CHANGED"

  be:
    needs: changes
    if: ${{ needs.changes.outputs.be == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/be/package-lock.json
      - run: npm ci
      - run: npm test
      - run: docker build -t be-check .
      - name: The image starts
        run: |
          docker run -d --name be-check -p 3000:3000 be-check
          for i in $(seq 20); do curl -fs localhost:3000/health && break; sleep 1; done
          curl -fs localhost:3000/health
          docker exec be-check ls migrations
      # The two commands the deploy runs before it starts a new be.
      - name: The image migrates the way the deploy runs it
        run: |
          docker run --rm --entrypoint test be-check -f migrate.js
          docker run --rm be-check node migrate.js | tee skip.log
          grep -qx 'no database, migrate skipped' skip.log
          if docker run --rm -e DATABASE_URL=postgres://ci:ci@127.0.0.1:1/none be-check node migrate.js; then
            echo "::error::migrate exited 0 with an unreachable database; the deploy would not stop"; exit 1
          fi
          echo "An unreachable database exits non-zero: the deploy stops."

  # Expand / contract (apps/be/MIGRATIONS.md): the rules hold, the migrations apply on top of the
  # last release's schema, and the last release still runs on the result, because a rollback does.
  migrations:
    needs: changes
    if: ${{ needs.changes.outputs.be == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    defaults:
      run:
        working-directory: apps/be
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/be/package-lock.json
      - run: npm ci

      - name: Find the last release
        id: prev
        run: |
          prev=$(git tag -l 'prod/v*' --sort=-v:refname | head -1)
          [ -n "$prev" ] || prev=$(git tag -l 'staging/v*' --sort=-v:refname | head -1)
          echo "ref=$prev" >> "$GITHUB_OUTPUT"
          echo "Comparing with ${prev:-nothing (no release yet)}"

      - name: Rules
        run: BASE_REF="${{ steps.prev.outputs.ref }}" node scripts/check-migrations.mjs

      - name: Last release's schema, then this change's migrations
        env:
          PREV: ${{ steps.prev.outputs.ref }}
        run: |
          if [ -n "$PREV" ]; then
            git worktree add "$RUNNER_TEMP/prev" "$PREV"
            if [ -f "$RUNNER_TEMP/prev/apps/be/migrate.js" ]; then
              (cd "$RUNNER_TEMP/prev/apps/be" && npm ci && node migrate.js)
            else
              echo "$PREV has no migrations; starting from an empty database"
            fi
          fi
          node migrate.js
          echo "Second run must apply nothing:"
          node migrate.js | tee second-run.log
          grep -q 'schema already current' second-run.log

      - name: The last release still runs on the new schema
        if: ${{ steps.prev.outputs.ref != '' }}
        run: |
          cd "$RUNNER_TEMP/prev/apps/be"
          [ -d node_modules ] || npm ci
          PORT=3101 node index.js > "$RUNNER_TEMP/prev.log" 2>&1 &
          for i in $(seq 30); do curl -fs localhost:3101/health && break; sleep 1; done
          curl -fs localhost:3101/health
          if grep -q "'/notes'" server.js; then
            curl -fs -X POST localhost:3101/notes -d '{"body":"from the last release"}'
            curl -fs localhost:3101/notes | grep -q 'from the last release'
          fi
          kill %1

      - name: This change runs on the new schema
        run: |
          PORT=3102 node index.js > "$RUNNER_TEMP/new.log" 2>&1 &
          for i in $(seq 30); do curl -fs localhost:3102/health && break; sleep 1; done
          curl -fs -X POST localhost:3102/notes -d '{"body":"from this change","author":"ci"}'
          curl -fs localhost:3102/notes | grep -q 'from this change'
          kill %1

      - name: Server logs
        if: always()
        run: cat "$RUNNER_TEMP/prev.log" "$RUNNER_TEMP/new.log" 2>/dev/null || true

  fe:
    needs: changes
    if: ${{ needs.changes.outputs.fe == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/fe/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  # The required check: passes when every app job that had to run passed, and skips count as pass.
  ci:
    needs: [changes, be, migrations, fe]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::A CI job failed or was cancelled."; exit 1
          fi
