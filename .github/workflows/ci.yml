name: CI

# One workflow for the whole repo. Each app's jobs run only when Nx says the change affects that
# app (or when this file changes); the "ci" job always runs and is the one required check on main,
# so a pull request that skips an app is not left waiting for a check that never starts.
# Nightly (and by hand) it runs everything on all files, with no base commit: the per-change gates
# (new-code coverage, mutation, the fix rule) skip themselves, every other check covers the whole
# repo, and a failure notifies without blocking anyone.
on:
  pull_request:
  push:
    # release/* holds hotfix cherry-picks, which reach no pull request.
    branches: [main, 'release/**']
  schedule:
    - cron: '41 19 * * *'
  workflow_dispatch:

# Cypress (e2e) never runs in CI; skipping its binary keeps npm ci from failing on its download.
env:
  CYPRESS_INSTALL_BINARY: "0"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.c.outputs.be }}
      fe: ${{ steps.c.outputs.fe }}
      infra: ${{ steps.c.outputs.infra }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - id: c
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BASE" HEAD)
            AFFECTED=$(npx nx show projects --affected --base="$BASE" --head=HEAD)
          else
            CHANGED=$(git ls-files)
            AFFECTED=$(npx nx show projects)
          fi
          all=$(grep -qx '.github/workflows/ci.yml' <<<"$CHANGED" && echo true || echo false)
          for app in be fe; do
            if [ "$all" = true ] || grep -qx "$app" <<<"$AFFECTED"; then echo "$app=true" >> "$GITHUB_OUTPUT"; fi
          done
          if [ "$all" = true ] || grep -q '^infra/' <<<"$CHANGED"; then echo "infra=true" >> "$GITHUB_OUTPUT"; fi
          echo "Affected (Nx): $(paste -sd, <<<"$AFFECTED")"; echo "Changed files:"; echo "$CHANGED"

  be:
    needs: changes
    if: ${{ needs.changes.outputs.be == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/be
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/be/package-lock.json
            package-lock.json
      - run: npm ci
      - name: Repo tooling (Nx, for test selection)
        working-directory: .
        run: npm ci
      - name: Known vulnerabilities in shipped packages
        run: bash ../../scripts/checks/audit.sh be
      - name: eslint on changed files
        run: bash ../../scripts/checks/lint-app.sh be
      - name: Type check (missed await, wrong field, possible null)
        run: npx tsc -p jsconfig.json
      # Only the tests of the be projects this change affects (scripts/checks/app-tests.sh); a feature
      # change runs that feature's tests and the routing tests, not the other features'.
      - name: Tests, with coverage
        run: |
          mapfile -t files < <(bash ../../scripts/checks/app-tests.sh be)
          echo "Test files (${#files[@]}): ${files[*]}"
          if [ ${#files[@]} -eq 0 ]; then echo "No be tests affected."; exit 0; fi
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=lcov.info "${files[@]}"
      - name: New-code coverage
        run: node ../../scripts/checks/new-code-coverage.mjs be lcov.info
      - name: Mutation testing on changed files (do the tests notice a change?)
        run: bash ../../scripts/checks/mutation.sh be
      - run: docker build -t be-check .
      - name: The image starts
        run: |
          docker run -d --name be-check -p 3000:3000 be-check
          for _ in $(seq 20); do curl -fs localhost:3000/health && break; sleep 1; done
          curl -fs localhost:3000/health
          docker exec be-check ls migrations
      # The two commands the deploy runs before it starts a new be.
      - name: The image migrates the way the deploy runs it
        run: |
          docker run --rm --entrypoint test be-check -f migrate.js
          docker run --rm be-check node migrate.js | tee skip.log
          grep -qx 'no database, migrate skipped' skip.log
          if docker run --rm -e DATABASE_URL=postgres://ci:ci@127.0.0.1:1/none be-check node migrate.js; then
            echo "::error::migrate exited 0 with an unreachable database; the deploy would not stop"; exit 1
          fi
          echo "An unreachable database exits non-zero: the deploy stops."

  # Expand / contract (apps/be/MIGRATIONS.md): the rules hold, the migrations apply on top of the
  # last release's schema, and the last release still runs on the result, because a rollback does.
  migrations:
    needs: changes
    if: ${{ needs.changes.outputs.be == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    defaults:
      run:
        working-directory: apps/be
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/be/package-lock.json
      - run: npm ci

      - name: Find the last release
        id: prev
        run: |
          prev=$(git tag -l 'prod/v*' --sort=-v:refname | head -1)
          [ -n "$prev" ] || prev=$(git tag -l 'staging/v*' --sort=-v:refname | head -1)
          echo "ref=$prev" >> "$GITHUB_OUTPUT"
          echo "Comparing with ${prev:-nothing (no release yet)}"

      - name: Rules
        run: BASE_REF="${{ steps.prev.outputs.ref }}" node scripts/check-migrations.mjs

      - name: Last release's schema, then this change's migrations
        env:
          PREV: ${{ steps.prev.outputs.ref }}
        run: |
          if [ -n "$PREV" ]; then
            git worktree add "$RUNNER_TEMP/prev" "$PREV"
            if [ -f "$RUNNER_TEMP/prev/apps/be/migrate.js" ]; then
              (cd "$RUNNER_TEMP/prev/apps/be" && npm ci && node migrate.js)
            else
              echo "$PREV has no migrations; starting from an empty database"
            fi
          fi
          node migrate.js
          echo "Second run must apply nothing:"
          node migrate.js | tee second-run.log
          grep -q 'schema already current' second-run.log

      - name: The last release still runs on the new schema
        if: ${{ steps.prev.outputs.ref != '' }}
        run: |
          cd "$RUNNER_TEMP/prev/apps/be"
          [ -d node_modules ] || npm ci
          PORT=3101 node index.js > "$RUNNER_TEMP/prev.log" 2>&1 &
          for _ in $(seq 30); do curl -fs localhost:3101/health && break; sleep 1; done
          curl -fs localhost:3101/health
          if grep -q "'/notes'" server.js; then
            curl -fs -X POST localhost:3101/notes -d '{"body":"from the last release"}'
            curl -fs localhost:3101/notes | grep -q 'from the last release'
          fi
          kill %1

      - name: This change runs on the new schema
        run: |
          PORT=3102 node index.js > "$RUNNER_TEMP/new.log" 2>&1 &
          for _ in $(seq 30); do curl -fs localhost:3102/health && break; sleep 1; done
          curl -fs -X POST localhost:3102/notes -d '{"body":"from this change","author":"ci"}'
          curl -fs localhost:3102/notes | grep -q 'from this change'
          kill %1

      - name: Server logs
        if: always()
        run: cat "$RUNNER_TEMP/prev.log" "$RUNNER_TEMP/new.log" 2>/dev/null || true

  fe:
    needs: changes
    if: ${{ needs.changes.outputs.fe == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fe
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/fe/package-lock.json
            package-lock.json
      - run: npm ci
      - name: Repo tooling (Nx, for test selection)
        working-directory: .
        run: npm ci
      - name: Known vulnerabilities in shipped packages
        run: bash ../../scripts/checks/audit.sh fe
      - name: eslint on changed files
        run: bash ../../scripts/checks/lint-app.sh fe
      # Only the tests of the fe projects this change affects (scripts/checks/app-tests.sh).
      - name: Tests, with coverage
        run: |
          mapfile -t files < <(bash ../../scripts/checks/app-tests.sh fe)
          echo "Test files (${#files[@]}): ${files[*]}"
          if [ ${#files[@]} -eq 0 ]; then echo "No fe tests affected."; exit 0; fi
          npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=coverage "${files[@]}"
      - name: New-code coverage
        run: node ../../scripts/checks/new-code-coverage.mjs fe coverage/lcov.info
      - name: Mutation testing on changed files (do the tests notice a change?)
        run: bash ../../scripts/checks/mutation.sh fe
      - run: npm run build

  # Terraform format and validity on every change to infra/, so a broken file never reaches the
  # plan on main. The plan itself stays in the Terraform workflow (it needs AWS).
  infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for d in infra infra/bootstrap; do
            terraform -chdir=$d init -backend=false -input=false >/dev/null
            terraform -chdir=$d validate
          done

  # Repo-wide rules, on new code only (what this change adds or modifies). Each rule is a script in
  # scripts/checks/; checks.test.sh proves the home-made ones fail on the mistake they exist for.
  # docs/lessons.md says which incident each rule comes from. Every step runs even after one
  # fails, so a change sees all its findings at once.
  rules:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      ACTIONLINT_VERSION: 1.7.7
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install actionlint and gitleaks
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: The checks catch what they exist for
        if: ${{ !cancelled() }}
        run: bash scripts/checks/checks.test.sh
      - name: A fix comes with a test
        if: ${{ !cancelled() }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/checks/fix-has-test.sh
      - name: Release logic decides every known case right
        if: ${{ !cancelled() }}
        run: bash scripts/release-meta.test.sh
      - name: Executable files keep their mode
        if: ${{ !cancelled() }}
        run: bash scripts/checks/executable-files.sh
      - name: Refs are pushed with the deploy key
        if: ${{ !cancelled() }}
        run: bash scripts/checks/no-token-refs.sh
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: bash scripts/checks/shell-scripts.sh
      - name: actionlint
        if: ${{ !cancelled() }}
        run: bash scripts/checks/workflows.sh
      - name: No secrets in the new commits
        if: ${{ !cancelled() }}
        run: bash scripts/checks/secrets.sh

  # The required check: passes when every job that had to run passed, and skips count as pass.
  ci:
    needs: [changes, be, migrations, fe, infra, rules]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::A CI job failed or was cancelled."; exit 1
          fi
