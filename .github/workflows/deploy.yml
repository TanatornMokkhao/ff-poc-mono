name: Deploy

# A change to deploy/<stage>/ or scripts/ on main deploys that stage (Release and Rollback write
# deploy/ through the deploy key, so their pushes start this too).
# staging deploys at once; prod waits for an approval on the production environment.
on:
  push:
    branches: [main]
    paths: ['deploy/**', 'scripts/**']
  workflow_dispatch:
    inputs:
      stage:
        description: Environment to deploy
        type: choice
        options: [staging, prod]

permissions:
  contents: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.c.outputs.staging }}
      prod: ${{ steps.c.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          STAGE: ${{ inputs.stage }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "$STAGE=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then CHANGED=$(git diff --name-only "$BEFORE" HEAD)
          else CHANGED=$(git ls-files); fi
          echo "$CHANGED"
          if grep -qE '^(deploy/staging/|scripts/)' <<< "$CHANGED"; then echo "staging=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE '^deploy/prod/' <<< "$CHANGED"; then echo "prod=true" >> "$GITHUB_OUTPUT"; fi

  staging:
    needs: changes
    if: ${{ needs.changes.outputs.staging == 'true' }}
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: staging
    secrets: inherit

  prod:
    needs: changes
    if: ${{ needs.changes.outputs.prod == 'true' }}
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
    secrets: inherit
